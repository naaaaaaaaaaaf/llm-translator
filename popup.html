<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Translator</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    .btn {
      padding: 8px 15px;
      margin: 5px 0;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn:hover {
      background-color: #3367d6;
    }
    #status {
      margin-top: 10px;
      color: #666;
      font-size: 13px;
    }
    h2 {
      color: #4285f4;
      margin-top: 0;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .info {
      font-size: 13px;
      margin-bottom: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2>LLM Translator</h2>
  
  <div class="info">
    テキストを選択して右クリックで翻訳できます。翻訳結果は新しいタブで表示されます。
  </div>
  
  <div class="btn-group">
    <button id="history-btn" class="btn">翻訳履歴を表示</button>
    <button id="options-btn" class="btn">API設定</button>
  </div>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
